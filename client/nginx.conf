server {
    listen 80;
    server_name localhost;

    # ── Serve React static files ─────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Required for React Router — all routes fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy REST API to Spring Boot ────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload support (matches your 20MB limit)
        client_max_body_size 20M;
    }

    # ── Proxy Auth endpoints ──────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy WebSocket (STOMP over SockJS) ──────────────────────────────────
    # CRITICAL: These headers are required or WebSocket will immediately disconnect
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;

        # These two lines are the most important — they upgrade HTTP to WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive longer (default 60s is too short)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Proxy file uploads/downloads ─────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 20M;
    }
}